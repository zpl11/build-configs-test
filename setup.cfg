[metadata]
name = devops_remote_executor
version = 0.1.0
description = DevOps core engine for large-scale infrastructure remote configuration management and asymmetric concurrent command execution.
author = DevOps Platform Team
author_email = devops@example.com
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    paramiko>=3.0

[options.packages.find]
where = src

[options.extras_require]
check =
    mypy>=1.0

[options.entry_points]
console_scripts =
    remote-exec-cli = devops_remote_executor.ssh_client:main
