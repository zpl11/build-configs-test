[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops_log_analyzer"
version = "0.1.0"
description = "Infrastructure-grade toolkit for DevOps production log stream cleansing, unstructured text field parsing, and performance metric extraction."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "DevOps Platform Team", email = "devops@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
bench = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
]

[project.scripts]
log-parse-cli = "devops_log_analyzer.processor:main"

[project.urls]
Homepage = "https://github.com/example/devops-log-analyzer"
Issues = "https://github.com/example/devops-log-analyzer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devops_log_analyzer = ["py.typed"]
