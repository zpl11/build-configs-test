[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my_py_utils"
version = "0.1.0"
description = "A core utility library for Python projects"
authors = [
    {name = "Developer", email = "dev@example.com"}
]
requires-python = ">=3.8"
dependencies = [
    "requests"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
py-util-cli = "my_py_utils.core:main"

[tool.setuptools.packages.find]
where = ["src"]
